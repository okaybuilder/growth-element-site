<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="base.css"><style>
body{background:#fcfcf9;color:#19271e;font-family:Manrope;display:grid;grid-template-columns:1fr 430px}
.copy{padding:70px 0 0 80px;position:relative}
.kicker{font-family:'DM Sans';font-weight:700;font-size:17px;letter-spacing:.17em;display:flex;align-items:center;gap:14px}
.kicker:before{content:"";width:12px;height:12px;border-radius:50%;background:#3d8a5c}
h1{font-weight:700;font-size:70px;line-height:1.0;letter-spacing:-.045em;margin-top:34px}
h1 em{font-style:normal;color:#28533f}
.url{position:absolute;bottom:58px;left:80px;font-family:'DM Sans';font-weight:500;font-size:22px;color:#657163}
.panel{background:#28533f;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:30px}
.mark{width:170px;height:205px;border-width:7px;border-color:#fcfcf9;color:#fcfcf9;font-size:106px}
.name{font-family:Manrope;font-weight:700;font-size:34px;line-height:1.02;letter-spacing:-.03em;color:#fcfcf9;text-align:left}
.stack{display:flex;flex-direction:column;align-items:flex-start;gap:28px}
.lime{position:absolute;right:0;top:0;width:430px;height:10px;background:#d9f46e}
</style></head><body>
<div class="copy"><div class="kicker">GROWTH, UNBLOCKED.</div><h1>Grow faster,<br>spend less,<br>and tell a story<br><em>people remember.</em></h1><div class="url">growthelement.ai</div></div>
<div class="panel"><div class="stack"><div class="mark"><b>Ge</b></div><div class="name">growth<br>element</div></div></div><div class="lime"></div>
</body></html>
